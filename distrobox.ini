[claude-desktop]
# $HOME, the X11 socket, $XDG_RUNTIME_DIR (covers Wayland), and D-Bus are shared with the container by distrobox's default behavior — no explicit flags needed for those.
image=ghcr.io/bjoernellens1/claude-desktop-distrobox:latest
pull=true
nvidia=true
# nvidia=true is distrobox's flag to pass through NVIDIA-specific GPU integration when present; on non-NVIDIA hosts it's a no-op. GPU access for Mesa/AMD/Intel (/dev/dri) and audio access (Pulse/PipeWire sockets under $XDG_RUNTIME_DIR) come for free via distrobox's default bind-mounts of /dev and /run/user/$UID — no explicit flags are needed for those.
# exported_apps exports the desktop app for launcher/menu integration; do not use init_hooks for this as it runs as root and distrobox-export refuses root.
exported_apps=claude-desktop
