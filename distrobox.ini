[claude-desktop]
# $HOME, the X11 socket, $XDG_RUNTIME_DIR (covers Wayland), and D-Bus are shared with the container by distrobox's default behavior — no explicit flags needed for those.
image=ghcr.io/bjoernellens1/claude-desktop-distrobox:latest
pull=true
nvidia=true
# nvidia=true is distrobox's flag to pass through NVIDIA-specific GPU integration when present; on non-NVIDIA hosts it's a no-op. GPU access for Mesa/AMD/Intel (/dev/dri) and audio access (Pulse/PipeWire sockets under $XDG_RUNTIME_DIR) come for free via distrobox's default bind-mounts of /dev and /run/user/$UID — no explicit flags are needed for those.
# exported_apps exports the desktop app for launcher/menu integration; do not use init_hooks for this as it runs as root and distrobox-export refuses root.
exported_apps=claude-desktop
# entry must be the literal integer 0 (not "false") — distrobox-assemble checks it with `-eq 0`. Suppresses distrobox's own generic "Terminal entering <container>" app-list shortcut, which is separate from exported_apps and otherwise clutters the menu alongside the real app entry.
entry=0
# CONTAINER_HOST as a container-level --env (not a /etc/profile.d script) —
# `distrobox-enter -n <container> -- <command>` does NOT go through a login
# shell, so /etc/profile.d is never sourced for actual app launches or for
# Claude Code's own Bash tool calls (both use exactly this invocation
# pattern). An --env set at container-create time applies unconditionally
# to every process, login shell or not.
additional_flags=--env CONTAINER_HOST=unix://${XDG_RUNTIME_DIR}/podman/podman.sock
