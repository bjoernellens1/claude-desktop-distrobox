[claude-desktop-unsafe]
image=ghcr.io/bjoernellens1/claude-desktop-distrobox:latest
pull=true
nvidia=true
# exported_apps exports the desktop app for launcher/menu integration; do not use init_hooks for this as it runs as root and distrobox-export refuses root.
exported_apps=claude-desktop
# This profile additionally mounts /mnt, /media, /run/media, the entire host filesystem read-write at /host-root, and passes through all host devices via /dev. This significantly reduces container isolation — only use when you specifically need the container to reach files or devices outside $HOME.
# GPU access (Mesa/AMD/Intel via /dev/dri, or NVIDIA via nvidia=true above) and audio access (Pulse/PipeWire sockets under $XDG_RUNTIME_DIR) come for free via distrobox's default bind-mounts of /dev and /run/user/$UID — no explicit flags are needed for those.
additional_flags=--volume /mnt:/mnt --volume /media:/media --volume /run/media:/run/media --volume /:/host-root --device /dev
